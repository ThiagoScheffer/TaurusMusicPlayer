name: Build and publish release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release-windows:
    name: Windows release
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository and LFS resources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Select release version
        id: version
        shell: pwsh
        run: |
          $existingTag = git tag --points-at $env:GITHUB_SHA --list "v[0-9]*" | Select-Object -First 1
          if ($existingTag) {
            "already_released=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "tag=$existingTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Commit already released as $existingTag."
            exit 0
          }

          $latestTag = git tag --list "v[0-9]*.[0-9]*.[0-9]*" --sort=-version:refname | Select-Object -First 1
          if ($latestTag -and $latestTag -match '^v(\d+)\.(\d+)\.(\d+)$') {
            $version = "{0}.{1}.{2}" -f $Matches[1], $Matches[2], ([int]$Matches[3] + 1)
          } else {
            $config = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
            $version = [string]$config.version
            if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "The configured app version '$version' is not semantic versioning."
            }
          }

          "already_released=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Preparing release v$version."

      - name: Set up Node.js
        if: steps.version.outputs.already_released != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust 1.93
        if: steps.version.outputs.already_released != 'true'
        shell: pwsh
        run: |
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt
          rustup default 1.93.0

      - name: Synchronize release version
        if: steps.version.outputs.already_released != 'true'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm version $env:RELEASE_VERSION --no-git-tag-version --allow-same-version

          $configPath = "src-tauri/tauri.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.version = $env:RELEASE_VERSION
          $config | ConvertTo-Json -Depth 100 | Set-Content $configPath -Encoding utf8

          $cargoPath = "src-tauri/Cargo.toml"
          $cargo = Get-Content $cargoPath -Raw
          $cargo = $cargo -replace '(?m)^version\s*=\s*"[^"]+"', "version = `"$env:RELEASE_VERSION`""
          Set-Content $cargoPath $cargo -Encoding utf8

      - name: Install frontend dependencies
        if: steps.version.outputs.already_released != 'true'
        run: npm ci

      - name: Run frontend tests
        if: steps.version.outputs.already_released != 'true'
        run: npm test

      - name: Build frontend
        if: steps.version.outputs.already_released != 'true'
        run: npm run build

      - name: Check Rust formatting
        if: steps.version.outputs.already_released != 'true'
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        if: steps.version.outputs.already_released != 'true'
        working-directory: src-tauri
        run: cargo test --all-targets

      - name: Refresh verified bundled playback tools
        if: steps.version.outputs.already_released != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run refresh:playback-tools

      - name: Build NSIS installer
        if: steps.version.outputs.already_released != 'true'
        run: npm run tauri -- build --bundles nsis

      - name: Prepare release assets
        if: steps.version.outputs.already_released != 'true'
        id: assets
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "The NSIS installer was not produced."
          }
          $checksum = Get-FileHash $installer.FullName -Algorithm SHA256
          $checksumFile = Join-Path $installer.DirectoryName "SHA256SUMS.txt"
          "{0}  {1}" -f $checksum.Hash.ToLowerInvariant(), $installer.Name | Set-Content $checksumFile -Encoding ascii
          "installer=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "checksums=$checksumFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish GitHub Release
        if: steps.version.outputs.already_released != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          INSTALLER_PATH: ${{ steps.assets.outputs.installer }}
          CHECKSUM_PATH: ${{ steps.assets.outputs.checksums }}
        run: |
          gh release create $env:RELEASE_TAG `
            $env:INSTALLER_PATH `
            $env:CHECKSUM_PATH `
            --target $env:GITHUB_SHA `
            --title "Taurus Music Player v$env:RELEASE_VERSION" `
            --generate-notes `
            --latest
